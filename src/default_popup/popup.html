<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../common/settings.css">
    <title>Privacy Magic</title>
    <script src="../privacymagic/i18n.js" type="module"></script>
    <style>
      html,
      body {
        width: 350px;
        min-height: 118px;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .main-container .toggle-box {
        margin-bottom: 0;
      }
      .main-container[hidden] {
        display: none;
      }
      .link-container {
        padding: 0.5em;
      }
      #advancedSettingsLinkContainer {
        background-color: transparent;
        margin-bottom: 0.35em;
      }
      #advancedSettingsLinkContainer[hidden] {
        display: none;
      }
      #safeLocalPage {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 4.5rem;
        position: static;
        top: auto;
        left: auto;
        transform: none;
      }
      #safeLocalPage[hidden] {
        display: none;
      }
      #popupLinks {
        display: flex;
        margin-top: auto;
        flex: 0 0 auto;
        flex-direction: column;
        justify-content: flex-end;
        background-color: var(--bg-muted);
        padding-top: 0.55em;
        padding-bottom: 0.35em;
      }
      #popupLinks[hidden] {
        display: none;
      }
      #popupLinks .link-container {
        background-color: transparent;
      }
    </style>
</head>

<body>
    <div class="main-container">
        <div id="siteInfoContainer">
            <img id="favicon" />
            <h2 id="domain"></h2>
        </div>
        <div id="settings" class="toggle-box toggle-container"></div>
    </div>
    <div id="safeLocalPage" data-i18n="safeLocalPage"></div>
    <div class="link-container" id="advancedSettingsLinkContainer" hidden>
        <a href="#" id="advancedSettingsLink" data-i18n="advancedSettingsLink"></a>
        <img src="../assets/images/right_panel_open.svg" alt="" id="advancedSettingsIcon" data-i18n-alt="advancedSettingsLink" />
    </div>
    <div id="popupLinks" hidden>
        <div class="link-container" id="continueSetupLinkContainer">
            <a href="#" id="continueSetupLink" data-i18n="continueSetupLink"></a>
            <img src="../assets/images/open_in_new.svg" alt="" id="continueSetupIcon" data-i18n-alt="continueSetupLink" />
        </div>
    </div>

    <script defer src="./popup.js" type="module"></script>
</body>

</html>
