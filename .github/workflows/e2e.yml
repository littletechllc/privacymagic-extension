name: E2E

on:
  workflow_call:
  workflow_dispatch:
  # Fresh browser channels every day (08:00 Pacific / 15:00 UTC).
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Branded Chrome cannot --load-extension (Chrome 137+); use Chrome for Testing.
        # chromium = Playwright-pinned control; cft-* = floating latest CfT builds.
        # Edge still honors --load-extension. edge-testing is the Dev channel
        # (Microsoft does not ship a separate Edge for Testing binary).
        include:
          - project: chromium
            chrome_version: ''
            edge_version: ''
          - project: cft-stable
            chrome_version: stable
            edge_version: ''
          - project: cft-canary
            chrome_version: canary
            edge_version: ''
          - project: edge-testing
            chrome_version: ''
            edge_version: dev
          - project: edge-release
            chrome_version: ''
            edge_version: stable
          - project: edge-canary
            chrome_version: ''
            edge_version: canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: ./.github/actions/setup-emscripten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Install Playwright Chromium (Chrome for Testing)
        if: matrix.project == 'chromium'
        run: npx playwright install chromium --with-deps
      - name: Install Chrome for Testing (${{ matrix.chrome_version }})
        id: setup-chrome
        if: matrix.chrome_version != ''
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome_version }}
          install-dependencies: true
      - name: Install browser system dependencies
        if: matrix.edge_version != ''
        run: npx playwright install-deps chromium
      - name: Install Microsoft Edge (${{ matrix.edge_version }})
        id: setup-edge
        if: matrix.edge_version != ''
        run: node .github/scripts/install-microsoft-edge.mjs ${{ matrix.edge_version }}
      - name: Log browser version
        env:
          PM_E2E_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path || steps.setup-edge.outputs.edge-path }}
          SETUP_CHROME_VERSION: ${{ steps.setup-chrome.outputs.chrome-version }}
          SETUP_EDGE_VERSION: ${{ steps.setup-edge.outputs.edge-version }}
        run: |
          set -euo pipefail
          echo "e2e project: ${{ matrix.project }}"
          if [ -n "${PM_E2E_EXECUTABLE_PATH:-}" ]; then
            if [ -n "${{ matrix.edge_version }}" ]; then
              echo "Microsoft Edge channel: ${{ matrix.edge_version }}"
              echo "installed version: ${SETUP_EDGE_VERSION:-unknown}"
            else
              echo "Chrome for Testing channel: ${{ matrix.chrome_version }}"
              echo "setup-chrome reported version: ${SETUP_CHROME_VERSION:-unknown}"
            fi
            echo "executable: $PM_E2E_EXECUTABLE_PATH"
            "$PM_E2E_EXECUTABLE_PATH" --version
          else
            echo "Playwright-managed Chromium (control)"
            node --input-type=module <<'EOF'
          import { chromium } from 'playwright'
          import { execFileSync } from 'node:child_process'
          const exe = chromium.executablePath()
          console.log('executable:', exe)
          execFileSync(exe, ['--version'], { stdio: 'inherit' })
          EOF
          fi
      - name: Run e2e tests
        env:
          PM_E2E_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path || steps.setup-edge.outputs.edge-path }}
          PW_CHROMIUM_ATTACH_TO_OTHER: '1'
        run: xvfb-run --auto-servernum -- npx playwright test --project=${{ matrix.project }}
